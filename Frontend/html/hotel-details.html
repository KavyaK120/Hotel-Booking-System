<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Details</title>

    <link rel="stylesheet" href="../css/hotels.css">

    <style>

        .hotel-details-card {
            max-width: 1000px;
            margin: 50px auto;
            background: #fff;
            display: flex;
            gap: 30px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,.2);
        }

        .hotel-details-card img {
            width: 50%;
            height: 500px;
            object-fit: cover;
        }

        .details {
            padding: 30px;
            flex: 1;
        }

        .details h2 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .details p {
            margin: 10px 0;
            font-size: 18px;
        }

        .details h3 {
            margin-top: 20px;
        }

        .details select,
        .details input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .book-btn {
            width: 100%;
            padding: 15px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #0b5ed7;
        }

        @media(max-width:768px) {

            .hotel-details-card {
                flex-direction: column;
            }

            .hotel-details-card img {
                width: 100%;
                height: 300px;
            }

        }

    </style>

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            🏨 Hotel Booking
        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="hotels.html">
                    Hotels
                </a>
            </li>

            <li>
                <a href="my-bookings.html">
                    My Bookings
                </a>
            </li>

            <li>
                <a href="login.html">
                    Logout
                </a>
            </li>

        </ul>

    </nav>

</header>


<section>

    <div class="hotel-details-card">


        <img
            id="hotelImage"
            alt="Hotel"
        >


        <div class="details">


            <h2 id="hotelName">
                Loading...
            </h2>


            <p id="hotelCity">
            </p>


            <p id="hotelLocation">
            </p>


            <p id="hotelRating">
            </p>


            <p id="hotelDescription">
            </p>


            <h2 id="hotelPrice">
            </h2>


            <hr>

            <br>


            <h3>
                Select Room
            </h3>


            <select id="roomType">

                <option>
                    Standard Room
                </option>

                <option>
                    Deluxe Room
                </option>

                <option>
                    Suite Room
                </option>

            </select>


            <label>
                Check-In
            </label>

            <input
                type="date"
                id="checkIn"
            >


            <label>
                Check-Out
            </label>

            <input
                type="date"
                id="checkOut"
            >


            <label>
                No. of Guests
            </label>

            <input
                type="number"
                id="guests"
                value="1"
                min="1"
                max="10"
            >


            <br>
            <br>


            <button
                class="book-btn"
                onclick="bookHotel()"
            >
                Book Now
            </button>


        </div>

    </div>

</section>


<script>


// ========================================
// BACKEND URL
// ========================================

const API_URL = "http://localhost:8082/api/hotels";


// ========================================
// GET HOTEL ID FROM URL
// ========================================

const params =
    new URLSearchParams(window.location.search);

const hotelId =
    Number(params.get("id"));


// ========================================
// LOAD HOTEL
// ========================================

let hotel = null;


async function loadHotel() {

    try {

        if (!hotelId) {

            alert("Hotel not found.");

            window.location.href = "hotels.html";

            return;
        }


        // Get all hotels from backend

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Failed to load hotels"
            );

        }


        const hotels =
            await response.json();


        // Find selected hotel

        hotel =
            hotels.find(
                h => h.id === hotelId
            );


        if (!hotel) {

            alert("Hotel not found.");

            window.location.href =
                "hotels.html";

            return;
        }


        // Display hotel

        document.getElementById("hotelImage").src =
            "../images/" + hotel.image;


        document.getElementById("hotelName").innerText =
            hotel.name;


        document.getElementById("hotelCity").innerText =
            "📍 " + hotel.city;


        document.getElementById("hotelLocation").innerText =
            "📌 " + hotel.location;


        document.getElementById("hotelRating").innerText =
            "⭐ " + hotel.rating;


        document.getElementById("hotelDescription").innerText =
            hotel.description;


        document.getElementById("hotelPrice").innerText =
            "₹" + hotel.pricePerNight + " / Night";


    }

    catch (error) {

        console.error(
            "Error loading hotel:",
            error
        );


        alert(
            "Unable to load hotel details."
        );

    }

}


// ========================================
// BOOK HOTEL
// ========================================

function bookHotel() {


    if (!hotel) {

        alert("Hotel information not loaded.");

        return;
    }


    const roomType =
        document.getElementById("roomType").value;


    const checkIn =
        document.getElementById("checkIn").value;


    const checkOut =
        document.getElementById("checkOut").value;


    const guests =
        document.getElementById("guests").value;


    // Validate dates

    if (!checkIn) {

        alert("Please select check-in date.");

        return;
    }


    if (!checkOut) {

        alert("Please select check-out date.");

        return;
    }


    if (checkOut <= checkIn) {

        alert(
            "Check-out date must be after check-in date."
        );

        return;
    }


    // Create booking object

    const booking = {

        hotelId: hotel.id,

        hotelName: hotel.name,

        city: hotel.city,

        location: hotel.location,

        roomType: roomType,

        checkIn: checkIn,

        checkOut: checkOut,

        guests: guests,

        price: hotel.pricePerNight

    };


    // Store temporarily

    localStorage.setItem(
        "booking",
        JSON.stringify(booking)
    );


    alert(
        "Hotel selected successfully!"
    );


    // Go to booking page

    window.location.href =
        "booking.html";

}


// ========================================
// START
// ========================================

loadHotel();

</script>


</body>

</html>
