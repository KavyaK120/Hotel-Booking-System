<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings | Hotel Booking System</title>

    <link rel="stylesheet" href="../css/booking.css">

    <style>

        .booking-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .booking-container h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .booking-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .booking-card h3 {
            margin-bottom: 15px;
            color: #0d6efd;
        }

        .booking-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .status {
            color: green;
            font-weight: bold;
        }

        .cancelled {
            color: red;
            font-weight: bold;
        }

        .no-bookings {
            text-align: center;
            font-size: 18px;
            margin-top: 50px;
        }

        .profile {
            color: white;
            font-weight: bold;
            margin-left: 20px;
            display: flex;
            align-items: center;
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        🏨 Hotel Booking
    </div>

    <ul class="nav-links">

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="hotels.html">Hotels</a>
        </li>

       <li>
    <a href="my-bookings.html" class="active">
        My Bookings
    </a>
</li>

        <li>
            <a href="profile.html" id="loggedUserName">
                👤 Profile
            </a>
        </li>

        <li>
            <a href="#" onclick="logout()">Logout</a>
        </li>

    </ul>

</nav>



<!-- ================= BOOKINGS ================= -->

<div class="booking-container">

    <h2>My Bookings</h2>


    <div id="bookingList">

        <p class="no-bookings">
            Loading bookings...
        </p>

    </div>

</div>



<!-- ================= JAVASCRIPT ================= -->

<script>


/* ==========================================
   DISPLAY LOGGED-IN USER
   ========================================== */

document.addEventListener("DOMContentLoaded", function () {

    const user =
        JSON.parse(localStorage.getItem("user"));

    const userName =
        document.getElementById("loggedUserName");


    if (user && userName) {

        userName.textContent = user.name;

    }

});



/* ==========================================
   LOAD USER BOOKINGS
   ========================================== */

async function loadBookings() {


    const user =
        JSON.parse(localStorage.getItem("user"));


    /* USER NOT LOGGED IN */

    if (!user || !user.id) {

        alert("Please login first.");

        window.location.href = "login.html";

        return;

    }


    const userId = user.id;


    try {


        const response = await fetch(

            `http://localhost:8082/api/bookings/user/${userId}`

        );


        if (!response.ok) {

            throw new Error(
                "Failed to load bookings"
            );

        }


        const bookings =
            await response.json();


        const bookingList =
            document.getElementById(
                "bookingList"
            );


        bookingList.innerHTML = "";


        /* NO BOOKINGS */

        if (bookings.length === 0) {

            bookingList.innerHTML = `

                <p class="no-bookings">

                    No bookings found.

                </p>

            `;

            return;

        }



        /* DISPLAY BOOKINGS */

        for (const booking of bookings) {


            let hotelName = "Hotel";

            let hotelLocation = "";


            /* GET HOTEL DETAILS */

            try {


                const hotelResponse =
                    await fetch(

                        `http://localhost:8082/api/hotels/${booking.hotelId}`

                    );


                if (hotelResponse.ok) {


                    const hotel =
                        await hotelResponse.json();


                    hotelName =
                        hotel.name;


                    hotelLocation =
                        hotel.location;

                }


            } catch (error) {

                console.log(
                    "Hotel details unavailable"
                );

            }



            /* STATUS CLASS */

            const statusClass =

                booking.bookingStatus === "CONFIRMED"

                    ? "status"

                    : "cancelled";



            /* CREATE CARD */

            const bookingCard =
                document.createElement("div");


            bookingCard.className =
                "booking-card";


            bookingCard.innerHTML = `

                <h3>
                    🏨 ${hotelName}
                </h3>


                <div class="booking-item">

                    <strong>
                        Location:
                    </strong>

                    <span>
                        📍 ${hotelLocation}
                    </span>

                </div>


                <div class="booking-item">

                    <strong>
                        Booking ID:
                    </strong>

                    <span>
                        ${booking.bookingId}
                    </span>

                </div>


                <div class="booking-item">

                    <strong>
                        Check In:
                    </strong>

                    <span>
                        ${booking.checkInDate}
                    </span>

                </div>


                <div class="booking-item">

                    <strong>
                        Check Out:
                    </strong>

                    <span>
                        ${booking.checkOutDate}
                    </span>

                </div>


                <div class="booking-item">

                    <strong>
                        Guests:
                    </strong>

                    <span>
                        ${booking.numberOfGuests}
                    </span>

                </div>


                <div class="booking-item">

                    <strong>
                        Total Amount:
                    </strong>

                    <span>
                        ₹${booking.totalAmount}
                    </span>

                </div>


                <div class="booking-item">

                    <strong>
                        Status:
                    </strong>

                    <span class="${statusClass}">

                        ${booking.bookingStatus}

                    </span>

                </div>

            `;


            bookingList.appendChild(
                bookingCard
            );

        }


    } catch (error) {


        console.error(
            "Booking loading error:",
            error
        );


        document.getElementById(
            "bookingList"
        ).innerHTML = `

            <p class="no-bookings">

                Unable to load bookings.

            </p>

        `;

    }

}



/* ==========================================
   LOAD BOOKINGS WHEN PAGE OPENS
   ========================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadBookings
);


</script>


</body>

</html>
